const css=' :host{display:block;width:100%;height:100%;background:transparent;contain:layout style;font-family:Arial,sans-serif}*{box-sizing:border-box}.stage{position:relative;width:100%;height:100%;background:transparent;container-type:inline-size;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center}.deck{position:absolute;inset:0;perspective:1000px}.card{position:absolute;left:29.5%;top:10%;width:41%;height:76%;border-radius:4cqw;padding:3.5cqw 3cqw 2cqw;color:#fff9ef;border:1px solid #ffc69569;background:linear-gradient(155deg,#090502 8%,#582403 53%,#f27b2c 80%,#ffe8d6);box-shadow:0 2cqw 5cqw #0008;transition:transform .85s cubic-bezier(.22,.8,.22,1),opacity .85s,filter .85s;transform-origin:50% 85%;display:flex;flex-direction:column;will-change:transform}.card h3{font-size:clamp(18px,5.2cqw,22px);font-weight:600;line-height:1.2;letter-spacing:-.025em;margin:2cqw 0 1cqw}.card p{font-size:clamp(13px,3.3cqw,16px);line-height:1.42;color:#f6ded0;margin:0 0 1.5cqw}.icon{width:8.5cqw;height:8.5cqw;border-radius:2cqw;background:#fff;color:#0e100b;display:grid;place-items:center;box-shadow:0 0.8cqw 2cqw #0004;flex-shrink:0}.icon svg{width:5.2cqw;height:5.2cqw}.art{margin-top:auto;border-radius:2.5cqw;height:30%!important;min-height:30%!important;flex-shrink:0;background:radial-gradient(at 95% 0,#ff8515,transparent 65%),linear-gradient(140deg,#542007,#050505 80%);border:1px solid #ffc89233;display:grid;place-items:center;overflow:hidden}.art svg{width:84%;height:80%;display:block}@media(min-width:992px) and (max-width:1199px){.card{left:27%!important;width:46%!important;height:62%!important}}@media(min-width:768px) and (max-width:991px){.card{left:27.5%;top:6%;width:45%;height:72%!important;border-radius:3cqw;padding:2.2cqw 2cqw 1.2cqw}.card h3{font-size:clamp(13px,2.1cqw,16px);line-height:1.15;margin:0.8cqw 0 0.4cqw}.card p{font-size:clamp(10.5px,1.5cqw,12px);line-height:1.2;margin:0 0 0.5cqw}.icon{width:4.2cqw;height:4.2cqw;border-radius:1cqw}.icon svg{width:2.6cqw;height:2.6cqw}.art{height:30%!important;min-height:30%!important;border-radius:1.5cqw}.art svg{width:78%;height:76%}}@media(max-width:767px){.card{left:23%;top:6%;width:54%;height:72%!important;border-radius:3cqw;padding:2.2cqw 2cqw 1.2cqw}.card h3{font-size:clamp(13px,3.2cqw,16px);line-height:1.18;margin:0.8cqw 0 0.4cqw}.card p{font-size:clamp(10.5px,2.3cqw,12px);line-height:1.25;margin:0 0 0.5cqw}.icon{width:5.8cqw;height:5.8cqw;border-radius:1.2cqw}.icon svg{width:3.6cqw;height:3.6cqw}.art{height:30%!important;min-height:30%!important;border-radius:1.5cqw}.art svg{width:82%;height:80%}}@media(max-width:425px){.card{left:20%!important;width:60%!important;height:74%!important}.card h3{font-size:12px!important}.card p{font-size:10px!important}}button{position:absolute;bottom:2%;right:3%;border:1px solid currentColor;border-radius:20px;padding:6px 12px;background:transparent;color:var(--cycler-control-color,#777);font:12px Arial;cursor:pointer;opacity:0;transition:opacity .2s}:host(:hover) button,button:focus-visible{opacity:1}button:focus-visible{outline:2px solid #ed7f25;outline-offset:3px}:host([controls]) button{opacity:1}@media(prefers-reduced-motion:reduce){.card{transition:none}}';
class ServiceCardCycler extends HTMLElement{
 static get observedAttributes(){return ['service','interval','paused']}
 constructor(){super();this.attachShadow({mode:'open'});this.index=0;this.timer=null;this.visible=true;this.motion=matchMedia('(prefers-reduced-motion: reduce)');this.onMotion=()=>this.schedule();this.onVisibility=()=>this.schedule();this.onResize=()=>this.render();}
 connectedCallback(){this.motion.addEventListener('change',this.onMotion);document.addEventListener('visibilitychange',this.onVisibility);window.addEventListener('resize',this.onResize);try{window.top?.addEventListener('resize',this.onResize)}catch(e){}this.draw();this.observer=new IntersectionObserver(entries=>{this.visible=entries[0].isIntersecting;this.schedule()});this.observer.observe(this);}
 disconnectedCallback(){clearInterval(this.timer);this.observer?.disconnect();this.motion.removeEventListener('change',this.onMotion);document.removeEventListener('visibilitychange',this.onVisibility);window.removeEventListener('resize',this.onResize);try{window.top?.removeEventListener('resize',this.onResize)}catch(e){}}
 attributeChangedCallback(name,old,value){if(old===value||!this.isConnected)return;if(name==='service')this.draw();else this.schedule();}
 get service(){return sets[this.getAttribute('service')]?this.getAttribute('service'):"ads"}

 draw(){this.index=0;const s=sets[this.service];this.shadowRoot.innerHTML=`<style>${css}</style><section class="stage" aria-label="${s.name} cards"><div class="deck">${s.cards.map(([t,p,k],i)=>`<article class="card"><div class="icon">${icon(k)}</div><h3>${t}</h3><p>${p}</p><div class="art">${art(k,i)}</div></article>`).join('')}</div><button type="button">Pause</button></section>`;this.shadowRoot.querySelector('button').onclick=()=>this.hasAttribute('paused')?this.play():this.pause();this.render();this.schedule();}
 render(){let topW=(()=>{try{return window.top?.innerWidth||window.innerWidth}catch(e){return window.innerWidth}})();this.shadowRoot.querySelectorAll('.card').forEach((c,i)=>{let d=(i-this.index+5)%5;if(d>2)d-=5;let isMobile=matchMedia('(max-width: 991px)').matches;let isTablet=topW>=768&&topW<=991;let is1024=topW>=992&&topW<=1199;let shift=is1024?11.5:(isTablet?13.5:(topW<768?13.5:16));let translateY=is1024?Math.abs(d)*3:(isTablet?Math.abs(d)*2.5:(topW<768?Math.abs(d)*2.5:Math.abs(d)*5));c.style.transform=`translateX(${d*shift}%) translateY(${translateY}%) rotate(${d*4.5}deg) scale(${1-Math.abs(d)*.085})`;c.style.zIndex=10-Math.abs(d);c.style.opacity=d===0?1:.85;c.style.filter=d===0?'none':'brightness(.65) blur(3.5px)';c.setAttribute('aria-hidden',String(d!==0));let cardW=41;let cardH=76;if(topW>=1600){cardW=41;cardH=76;c.style.width='41%';c.style.height='76%'}else if(topW>=1200){cardW=41;cardH=72;c.style.width='41%';c.style.height='72%'}else if(topW>=992){cardW=46;cardH=62;c.style.width='46%';c.style.height='62%'}else if(topW>=768){cardW=45;cardH=72;c.style.width='45%';c.style.height='72%'}else if(topW<=425){cardW=60;cardH=74;c.style.width='60%';c.style.height='74%'}else{cardW=54;cardH=72;c.style.width='54%';c.style.height='72%'}c.style.left=((100-cardW)/2)+'%';c.style.top=((100-cardH)/2)+'%';});
 }
 next(){this.index=(this.index+1)%5;this.render()}

}
if(!customElements.get("paid-ads-cycler"))customElements.define("paid-ads-cycler",ServiceCardCycler);
