<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Journal & Articles | Blackwater Digital</title>
    <meta name="description" content="Explore insights, marketing strategies, and creative production analysis from the Blackwater Digital team." />
    
    <meta property="og:title" content="Journal & Articles | Blackwater Digital" />
    <meta property="og:description" content="Insights on SEO, Paid Ads, Web Design, and Video Production." />
    <meta property="og:image" content="/assets/images/logo.svg" />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
    <link href="/assets/css/webflow.css?v=64" rel="stylesheet" type="text/css" />

    <style>
        .blogs_page_wrap {
            padding: 140px 0 100px;
            min-height: 80vh;
        }
        .blogs_container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 32px;
        }
        .blogs_header {
            margin-bottom: 56px;
        }
        .blogs_title {
            font-size: 56px;
            color: #FFFCE1;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        .blogs_subtitle {
            font-size: 18px;
            color: #7C7C70;
            max-width: 600px;
            line-height: 1.6;
        }
        .blogs_controls_bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 44px;
            flex-wrap: wrap;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .category_chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .category_chip {
            padding: 8px 18px;
            border-radius: 24px;
            background: #141716;
            color: #7C7C70;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .category_chip:hover, .category_chip.active {
            background: rgba(135, 186, 178, 0.15);
            color: #87BAB2;
            border-color: #87BAB2;
        }
        .blog_search_input {
            background: #141716;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFFCE1;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 14px;
            width: 280px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .blog_search_input:focus {
            border-color: #87BAB2;
        }
        .blogs_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 36px;
        }
        .blog_card {
            background: #141716;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .blog_card:hover {
            transform: translateY(-6px);
            border-color: rgba(135, 186, 178, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }
        .blog_card_img_wrap {
            height: 220px;
            background: #1a1e1c;
            position: relative;
            overflow: hidden;
        }
        .blog_card_img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .blog_card:hover .blog_card_img {
            transform: scale(1.04);
        }
        .blog_card_body {
            padding: 28px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .blog_card_meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #87BAB2;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .blog_card_meta span {
            color: #7C7C70;
            font-weight: 400;
        }
        .blog_card_title {
            color: #FFFCE1;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 12px;
            transition: color 0.2s ease;
        }
        .blog_card:hover .blog_card_title {
            color: #87BAB2;
        }
        .blog_card_excerpt {
            color: #7C7C70;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .blog_card_cta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #FFFCE1;
            font-size: 14px;
            font-weight: 600;
            margin-top: auto;
        }
        .blog_card_cta span {
            transition: transform 0.2s ease;
        }
        .blog_card:hover .blog_card_cta span {
            transform: translateX(4px);
        }
        @media (max-width: 767px) {
            .blogs_title {
                font-size: 36px;
            }
            .blogs_grid {
                grid-template-columns: 1fr;
            }
            .blog_search_input {
                width: 100%;
            }
        }
    </style>
</head>
<body style="background-color: #0E100F;">

    <!-- Navbar -->
    <div class="simple-navbar" style="position: fixed; top: 0; left: 0; width: 100%; height: 90px; z-index: 999; background-color: #0E100F; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100%; padding: 0 40px;">
            <a href="/" data-barba-prevent style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="/logo.svg" alt="Blackwater" style="height: 36px;">
                <span style="font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: #FFFCE1; letter-spacing: -0.02em;">Blackwater</span>
            </a>

            <div style="display: flex; gap: 32px; align-items: center;">
                <a href="/work" data-barba-prevent style="color: #7C7C70; font-size: 14px; font-weight: 600; text-transform: uppercase;">Work</a>
                <a href="/about" data-barba-prevent style="color: #7C7C70; font-size: 14px; font-weight: 600; text-transform: uppercase;">About</a>
                <a href="/services" data-barba-prevent style="color: #7C7C70; font-size: 14px; font-weight: 600; text-transform: uppercase;">Services</a>
                <a href="/blogs" data-barba-prevent style="color: #87BAB2; font-size: 14px; font-weight: 600; text-transform: uppercase;">Journal</a>
                <a href="/contact" data-barba-prevent style="background: #87BAB2; color: #0c0e0d; padding: 10px 22px; border-radius: 4px; font-size: 13px; font-weight: 700; text-transform: uppercase;">Contact</a>
            </div>
        </div>
    </div>

    <!-- Blogs List Section -->
    <main class="blogs_page_wrap">
        <div class="blogs_container">
            <header class="blogs_header">
                <a href="/" data-barba-prevent style="color: #87BAB2; font-size: 14px; text-decoration: none; margin-bottom: 12px; display: inline-block;">← Return Home</a>
                <h1 class="blogs_title">The Journal</h1>
                <p class="blogs_subtitle">
                    Strategic perspectives on high-performance paid ads, local SEO, website conversion, and human-first creative production.
                </p>
            </header>

            <div class="blogs_controls_bar">
                <div class="category_chips" id="category-chips-wrap">
                    <button type="button" class="category_chip active" data-category="">All Categories</button>
                </div>

                <div>
                    <input type="text" id="blog-search" class="blog_search_input" placeholder="Search articles...">
                </div>
            </div>

            <!-- Blog Cards Grid -->
            <div class="blogs_grid" id="blogs-grid">
                <div style="grid-column: 1 / -1; text-align: center; color: #7C7C70; padding: 80px 0;">
                    Loading publications...
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background: #080909; border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 60px 40px; text-align: center; color: #646a66; font-size: 14px;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div style="color: #FFFCE1; font-weight: 600;">© 2026 Blackwater Digital. All rights reserved.</div>
            <div style="display: flex; gap: 24px;">
                <a href="/blogs" data-barba-prevent style="color: #87BAB2;">Journal</a>
                <a href="/admin" data-barba-prevent style="color: #646a66;">Admin Portal</a>
                <a href="/contact" data-barba-prevent style="color: #7C7C70;">Contact</a>
            </div>
        </div>
    </footer>

    <!-- Client-Side Loading Script -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('blogs-grid');
            const chipsWrap = document.getElementById('category-chips-wrap');
            const searchInput = document.getElementById('blog-search');

            let currentCategory = '';
            let currentSearch = '';

            // 1. Fetch Categories
            try {
                const catRes = await fetch('/api/categories');
                if (catRes.ok) {
                    const catData = await catRes.json();
                    if (catData.categories && catData.categories.length > 0) {
                        catData.categories.forEach(cat => {
                            const btn = document.createElement('button');
                            btn.className = 'category_chip';
                            btn.textContent = cat.name;
                            btn.dataset.category = cat.slug || cat.name;
                            btn.addEventListener('click', () => {
                                document.querySelectorAll('.category_chip').forEach(c => c.classList.remove('active'));
                                btn.classList.add('active');
                                currentCategory = btn.dataset.category;
                                fetchBlogs();
                            });
                            chipsWrap.appendChild(btn);
                        });
                    }
                }
            } catch (e) {}

            // Category "All" chip click
            chipsWrap.querySelector('.category_chip').addEventListener('click', (e) => {
                document.querySelectorAll('.category_chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = '';
                fetchBlogs();
            });

            // 2. Search Debounce
            let debounceTimer;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    currentSearch = e.target.value.trim();
                    fetchBlogs();
                }, 300);
            });

            // 3. Fetch Blogs
            async function fetchBlogs() {
                try {
                    let url = '/api/blogs?';
                    if (currentCategory) url += `category=${encodeURIComponent(currentCategory)}&`;
                    if (currentSearch) url += `search=${encodeURIComponent(currentSearch)}&`;

                    const res = await fetch(url);
                    if (!res.ok) throw new Error('API offline');

                    const data = await res.json();
                    renderGrid(data.blogs || []);
                } catch (err) {
                    // Fallback to static articles if DB isn't running yet
                    if (window.journalArticles && Array.isArray(window.journalArticles)) {
                        let filtered = window.journalArticles;
                        if (currentCategory) {
                            filtered = filtered.filter(a => a.category.toLowerCase().includes(currentCategory.toLowerCase()));
                        }
                        if (currentSearch) {
                            filtered = filtered.filter(a => a.title.toLowerCase().includes(currentSearch.toLowerCase()));
                        }
                        renderGrid(filtered.map(a => ({
                            title: a.title,
                            slug: a.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''),
                            category: a.category,
                            reading_time: a.readingTime,
                            featured_image: a.image,
                            excerpt: a.excerpt
                        })));
                    } else {
                        grid.innerHTML = `
                            <div style="grid-column: 1 / -1; text-align: center; color: #7C7C70; padding: 80px 0;">
                                No published articles found at the moment. Check back soon!
                            </div>
                        `;
                    }
                }
            }

            function renderGrid(blogs) {
                if (!blogs || blogs.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; color: #7C7C70; padding: 80px 0;">
                            No articles found matching your query.
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = blogs.map(blog => {
                    const dateStr = blog.published_at 
                        ? new Date(blog.published_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                        : '';
                    const imgHtml = blog.featured_image
                        ? `<img src="${blog.featured_image}" alt="${escapeHtml(blog.title)}" class="blog_card_img" onerror="this.src='/logo.svg'">`
                        : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#646a66;font-size:12px;">BLACKWATER JOURNAL</div>`;

                    return `
                        <a href="/blog/${blog.slug}" class="blog_card" data-barba-prevent>
                            <div class="blog_card_img_wrap">
                                ${imgHtml}
                            </div>
                            <div class="blog_card_body">
                                <div class="blog_card_meta">
                                    ${escapeHtml(blog.category || 'General')}
                                    ${blog.reading_time ? `<span>&middot; ${escapeHtml(blog.reading_time)}</span>` : ''}
                                    ${dateStr ? `<span>&middot; ${dateStr}</span>` : ''}
                                </div>
                                <h2 class="blog_card_title">${escapeHtml(blog.title)}</h2>
                                <p class="blog_card_excerpt">${escapeHtml(blog.excerpt || '')}</p>
                                <div class="blog_card_cta">
                                    Read Article <span>→</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            }

            function escapeHtml(text) {
                if (!text) return '';
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            // Initial load
            fetchBlogs();
        });
    </script>
</body>
</html>
