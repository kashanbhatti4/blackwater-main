<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Blackwater Blog CMS</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="/logo.svg" alt="Blackwater Digital Logo">
                <h2>Blog CMS Portal</h2>
                <p>Enter your credentials to access the dashboard</p>
            </div>

            <div id="login-alert" class="alert alert-danger"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" class="form-control" placeholder="admin@blackwater.com" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    Sign In to Dashboard
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('login-alert');
            const submitBtn = document.getElementById('login-btn');
            
            alertBox.style.display = 'none';
            alertBox.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    if (data.token) {
                        localStorage.setItem('admin_token', data.token);
                    }
                    window.location.href = '/admin/index.html';
                } else {
                    alertBox.textContent = data.error || 'Invalid credentials.';
                    alertBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In to Dashboard';
                }
            } catch (err) {
                alertBox.textContent = 'Server connection failed. Make sure server is running.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to Dashboard';
            }
        });

        // Redirect if already logged in
        (async () => {
            const token = localStorage.getItem('admin_token');
            if (token) {
                try {
                    const res = await fetch('/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        window.location.href = '/admin/index.html';
                    }
                } catch (e) {}
            }
        })();
    </script>
</body>
</html>
