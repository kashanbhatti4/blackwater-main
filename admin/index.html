<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Management | Blackwater CMS</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/logo.svg" alt="Blackwater Logo">
                <span>Blog CMS</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/admin/index.html" class="nav-item active">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                    Blog Posts
                </a>
                <a href="#categories-modal" onclick="openTaxonomyModal()" class="nav-item">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 11h.01M7 15h.01M13 7h7M13 11h7M13 15h7M4 19h16a2 2 0 002-2V7a2 2 0 00-2-2H4a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Categories & Tags
                </a>
                <a href="/blog" target="_blank" class="nav-item">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    View Public Blog ↗
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="btn btn-secondary" style="width: 100%;">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Sign Out
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="header-bar">
                <div class="header-title">
                    <h1>Blog Posts</h1>
                    <p>Manage, write, edit, and publish your website articles</p>
                </div>
                <a href="/admin/editor.html" class="btn btn-primary">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Create New Blog
                </a>
            </div>

            <!-- Filters Bar -->
            <div class="card" style="padding: 16px;">
                <div style="display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; align-items: center;">
                    <div style="display: flex; gap: 12px; flex: 1; max-width: 500px;">
                        <input type="text" id="search-input" class="form-control" placeholder="Search blog title..." style="margin: 0;">
                        <select id="status-filter" class="form-control" style="width: 160px; margin: 0;">
                            <option value="all">All Status</option>
                            <option value="published">Published</option>
                            <option value="draft">Drafts</option>
                        </select>
                    </div>
                    <div style="color: var(--text-muted); font-size: 0.88rem;" id="total-count">
                        Total Blogs: 0
                    </div>
                </div>
            </div>

            <div id="alert-message" class="alert"></div>

            <!-- Blogs Table -->
            <div class="card" style="padding: 0; overflow: hidden;">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Title & Slug</th>
                                <th>Category</th>
                                <th>Status</th>
                                <th>Published / Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="blogs-table-body">
                            <tr>
                                <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                                    Loading blog posts...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Taxonomy Modal (Categories & Tags Manager) -->
    <div id="taxonomy-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
        <div class="card" style="width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; position: relative;">
            <button onclick="closeTaxonomyModal()" style="position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h2 style="margin-bottom: 20px;">Manage Categories & Tags</h2>

            <div class="form-group">
                <label>Add New Category</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="new-cat-name" class="form-control" placeholder="e.g. Content Strategy">
                    <button onclick="createCategory()" class="btn btn-primary" style="white-space: nowrap;">Add Category</button>
                </div>
                <div id="cat-list" style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 24px 0;">

            <div class="form-group">
                <label>Add New Tag</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="new-tag-name" class="form-control" placeholder="e.g. Google Ads">
                    <button onclick="createTag()" class="btn btn-secondary" style="white-space: nowrap;">Add Tag</button>
                </div>
                <div id="tag-list" style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('admin_token');

        if (!token) {
            window.location.href = '/admin/login.html';
        }

        function getAuthHeaders() {
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        let allBlogs = [];

        async function loadBlogs() {
            try {
                const res = await fetch('/api/admin/blogs', { headers: getAuthHeaders() });
                if (res.status === 401) {
                    localStorage.removeItem('admin_token');
                    window.location.href = '/admin/login.html';
                    return;
                }
                const data = await res.json();
                allBlogs = data.blogs || [];
                renderTable();
            } catch (err) {
                showAlert('Failed to connect to backend database.', 'danger');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('blogs-table-body');
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const statusVal = document.getElementById('status-filter').value;

            let filtered = allBlogs.filter(b => {
                const matchesSearch = b.title.toLowerCase().includes(searchVal) || b.slug.toLowerCase().includes(searchVal);
                const matchesStatus = statusVal === 'all' || b.status === statusVal;
                return matchesSearch && matchesStatus;
            });

            document.getElementById('total-count').textContent = `Total Blogs: ${filtered.length}`;

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">
                            No blog posts found. Click "Create New Blog" to write your first article!
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(blog => {
                const img = blog.featured_image || '/assets/images/logo.svg';
                const statusBadge = blog.status === 'published' 
                    ? `<span class="badge badge-published">Published</span>` 
                    : `<span class="badge badge-draft">Draft</span>`;
                const dateStr = blog.published_at 
                    ? new Date(blog.published_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
                    : new Date(blog.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

                return `
                    <tr>
                        <td><img src="${img}" class="table-img" alt="${blog.title}" onerror="this.src='/logo.svg'"></td>
                        <td>
                            <strong style="color: var(--text-main);">${escapeHtml(blog.title)}</strong>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">/blog/${blog.slug}</div>
                        </td>
                        <td><span class="badge badge-category">${blog.category_name || 'Uncategorized'}</span></td>
                        <td>${statusBadge}</td>
                        <td style="font-size: 0.85rem;">${dateStr}</td>
                        <td>
                            <div style="display: flex; gap: 8px;">
                                <button onclick="toggleStatus(${blog.id}, '${blog.status}')" class="btn btn-secondary btn-sm">
                                    ${blog.status === 'published' ? 'Unpublish' : 'Publish'}
                                </button>
                                <a href="/admin/editor.html?id=${blog.id}" class="btn btn-secondary btn-sm">Edit</a>
                                <button onclick="deleteBlog(${blog.id}, '${escapeHtml(blog.title)}')" class="btn btn-danger btn-sm">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'published' ? 'draft' : 'published';
            try {
                const res = await fetch(`/api/admin/blogs/${id}/status`, {
                    method: 'PATCH',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.ok) {
                    showAlert(`Blog post status updated to ${newStatus}.`, 'success');
                    loadBlogs();
                } else {
                    const data = await res.json();
                    showAlert(data.error || 'Failed to update status.', 'danger');
                }
            } catch (err) {
                showAlert('Server communication error.', 'danger');
            }
        }

        async function deleteBlog(id, title) {
            if (!confirm(`Are you sure you want to delete the blog post "${title}"? This cannot be undone.`)) {
                return;
            }

            try {
                const res = await fetch(`/api/admin/blogs/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (res.ok) {
                    showAlert('Blog post deleted successfully.', 'success');
                    loadBlogs();
                } else {
                    const data = await res.json();
                    showAlert(data.error || 'Failed to delete blog post.', 'danger');
                }
            } catch (err) {
                showAlert('Server communication error.', 'danger');
            }
        }

        // Taxonomy Management Modal Functions
        async function openTaxonomyModal() {
            document.getElementById('taxonomy-modal').style.display = 'flex';
            loadTaxonomies();
        }

        function closeTaxonomyModal() {
            document.getElementById('taxonomy-modal').style.display = 'none';
        }

        async function loadTaxonomies() {
            const catRes = await fetch('/api/categories');
            const catData = await catRes.json();
            const catDiv = document.getElementById('cat-list');
            catDiv.innerHTML = (catData.categories || []).map(c => `
                <span class="badge badge-category" style="display: flex; align-items: center; gap: 6px;">
                    ${escapeHtml(c.name)}
                    <span onclick="deleteCategory(${c.id})" style="cursor: pointer; font-weight: bold; margin-left: 4px;">&times;</span>
                </span>
            `).join('');

            const tagRes = await fetch('/api/tags');
            const tagData = await tagRes.json();
            const tagDiv = document.getElementById('tag-list');
            tagDiv.innerHTML = (tagData.tags || []).map(t => `
                <span class="badge badge-draft" style="display: flex; align-items: center; gap: 6px;">
                    ${escapeHtml(t.name)}
                    <span onclick="deleteTag(${t.id})" style="cursor: pointer; font-weight: bold; margin-left: 4px;">&times;</span>
                </span>
            `).join('');
        }

        async function createCategory() {
            const name = document.getElementById('new-cat-name').value.trim();
            if (!name) return;
            await fetch('/api/admin/categories', {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ name })
            });
            document.getElementById('new-cat-name').value = '';
            loadTaxonomies();
        }

        async function deleteCategory(id) {
            if (!confirm('Delete this category?')) return;
            await fetch(`/api/admin/categories/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
            loadTaxonomies();
        }

        async function createTag() {
            const name = document.getElementById('new-tag-name').value.trim();
            if (!name) return;
            await fetch('/api/admin/tags', {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ name })
            });
            document.getElementById('new-tag-name').value = '';
            loadTaxonomies();
        }

        async function deleteTag(id) {
            if (!confirm('Delete this tag?')) return;
            await fetch(`/api/admin/tags/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
            loadTaxonomies();
        }

        function showAlert(msg, type = 'success') {
            const box = document.getElementById('alert-message');
            box.className = `alert alert-${type}`;
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        document.getElementById('search-input').addEventListener('input', renderTable);
        document.getElementById('status-filter').addEventListener('change', renderTable);
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            localStorage.removeItem('admin_token');
            window.location.href = '/admin/login.html';
        });

        loadBlogs();
    </script>
</body>
</html>
