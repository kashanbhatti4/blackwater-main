<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor | Blackwater CMS</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/logo.svg" alt="Blackwater Logo">
                <span>Blog CMS</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/admin/index.html" class="nav-item">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Dashboard
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="logout-btn" class="btn btn-secondary" style="width: 100%;">Sign Out</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="header-bar">
                <div class="header-title">
                    <h1 id="editor-page-title">Create New Blog Post</h1>
                    <p>Draft your content, manage media, and optimize for search engines</p>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button onclick="savePost('draft')" id="draft-btn" class="btn btn-secondary">Save Draft</button>
                    <button onclick="savePost('published')" id="publish-btn" class="btn btn-primary">Publish Post</button>
                </div>
            </div>

            <div id="editor-alert" class="alert"></div>

            <form id="editor-form" onsubmit="return false;">
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
                    
                    <!-- Left Column: Title, Slug, Content -->
                    <div>
                        <!-- Title Field -->
                        <div class="card">
                            <div class="form-group">
                                <label for="post-title">Blog Title *</label>
                                <input type="text" id="post-title" class="form-control" placeholder="e.g. 5 Strategies to Scale Google Ads in 2026" style="font-size: 1.2rem; font-weight: 600;" required>
                            </div>

                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="post-slug">URL Slug</label>
                                <div style="display: flex; align-items: center; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding-left: 12px;">
                                    <span style="color: var(--text-muted); font-size: 0.9rem;">/blog/</span>
                                    <input type="text" id="post-slug" class="form-control" style="border: none; background: transparent; padding-left: 4px;" placeholder="auto-generated-from-title">
                                </div>
                            </div>
                        </div>

                        <!-- Summary / Excerpt -->
                        <div class="card">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="post-excerpt">Excerpt / Summary</label>
                                <textarea id="post-excerpt" class="form-control" rows="3" placeholder="Brief summary displayed on blog list cards and search snippets..."></textarea>
                            </div>
                        </div>

                        <!-- Rich Text Content Editor -->
                        <div class="card">
                            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Blog Content *</label>
                            
                            <!-- Formatting Toolbar -->
                            <div class="editor-toolbar">
                                <button type="button" class="tool-btn" onclick="execCmd('bold')"><b>B</b></button>
                                <button type="button" class="tool-btn" onclick="execCmd('italic')"><i>I</i></button>
                                <button type="button" class="tool-btn" onclick="execCmd('underline')"><u>U</u></button>
                                <button type="button" class="tool-btn" onclick="formatBlock('h2')">H2</button>
                                <button type="button" class="tool-btn" onclick="formatBlock('h3')">H3</button>
                                <button type="button" class="tool-btn" onclick="execCmd('insertUnorderedList')">• Bullet List</button>
                                <button type="button" class="tool-btn" onclick="execCmd('insertOrderedList')">1. Num List</button>
                                <button type="button" class="tool-btn" onclick="formatBlock('blockquote')">“ Quote</button>
                                <button type="button" class="tool-btn" onclick="insertLink()">🔗 Link</button>
                                <button type="button" class="tool-btn" onclick="execCmd('removeFormat')">🧹 Clear Format</button>
                            </div>

                            <div id="post-content" class="editor-content" contenteditable="true" placeholder="Write your full article content here..."></div>
                        </div>

                        <!-- SEO Metadata Card -->
                        <div class="card">
                            <h3 style="margin-bottom: 16px; font-size: 1.1rem;">SEO Settings</h3>
                            <div class="form-group">
                                <label for="seo-title">SEO Meta Title</label>
                                <input type="text" id="seo-title" class="form-control" placeholder="Custom page title for Google search results">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="seo-description">SEO Meta Description</label>
                                <textarea id="seo-description" class="form-control" rows="2" placeholder="Custom meta description for search engines (150-160 characters recommended)"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Settings & Media -->
                    <div>
                        <!-- Featured Image Card -->
                        <div class="card">
                            <h3 style="margin-bottom: 16px; font-size: 1.1rem;">Featured Image</h3>
                            
                            <div class="upload-box" id="upload-drop-zone" onclick="document.getElementById('image-file-input').click()">
                                <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin: 0 auto 10px; display: block; color: var(--accent-orange);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <span style="font-size: 0.9rem; color: var(--text-main); font-weight: 500;">Click to upload image</span>
                                <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;">JPG, PNG, or WebP (Max 5MB)</div>
                                <input type="file" id="image-file-input" accept="image/jpeg,image/png,image/webp" style="display: none;" onchange="handleFileSelect(event)">
                            </div>

                            <div id="image-preview-container" style="display: none; margin-top: 16px; text-align: center;">
                                <img id="image-preview" src="" class="upload-preview" alt="Featured Image Preview">
                                <div style="margin-top: 8px; font-size: 0.8rem; color: var(--text-muted); word-break: break-all;" id="image-url-text"></div>
                                <button type="button" onclick="removeFeaturedImage()" class="btn btn-danger btn-sm" style="margin-top: 8px;">Remove Image</button>
                            </div>
                        </div>

                        <!-- Organization Settings -->
                        <div class="card">
                            <h3 style="margin-bottom: 16px; font-size: 1.1rem;">Post Settings</h3>

                            <div class="form-group">
                                <label for="post-category">Category</label>
                                <select id="post-category" class="form-control">
                                    <option value="">Select Category...</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="reading-time">Reading Time</label>
                                <input type="text" id="reading-time" class="form-control" placeholder="e.g. 5 min read" value="5 min read">
                            </div>

                            <div class="form-group" style="margin-bottom: 0;">
                                <label>Tags</label>
                                <div id="tags-checkbox-container" style="max-height: 160px; overflow-y: auto; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px;">
                                    <span style="color: var(--text-muted); font-size: 0.85rem;">Loading tags...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/admin/login.html';

        const urlParams = new URLSearchParams(window.location.search);
        const editingPostId = urlParams.get('id');

        let currentFeaturedImageUrl = null;
        let isSlugManuallyEdited = false;

        function getAuthHeaders() {
            return { 'Authorization': `Bearer ${token}` };
        }

        // Auto Slug Generator
        document.getElementById('post-title').addEventListener('input', (e) => {
            if (!isSlugManuallyEdited && !editingPostId) {
                const slugInput = document.getElementById('post-slug');
                slugInput.value = e.target.value
                    .toLowerCase()
                    .trim()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-');
            }
        });

        document.getElementById('post-slug').addEventListener('input', () => {
            isSlugManuallyEdited = true;
        });

        // Formatting Commands
        function execCmd(cmd, arg = null) {
            document.execCommand(cmd, false, arg);
        }

        function formatBlock(tag) {
            document.execCommand('formatBlock', false, tag);
        }

        function insertLink() {
            const url = prompt('Enter link URL:', 'https://');
            if (url) execCmd('createLink', url);
        }

        // Image Upload Logic
        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const alertBox = document.getElementById('editor-alert');
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/admin/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                const data = await res.json();
                if (res.ok && data.url) {
                    currentFeaturedImageUrl = data.url;
                    showImagePreview(data.url);
                } else {
                    showAlert(data.error || 'Image upload failed.', 'danger');
                }
            } catch (err) {
                showAlert('Upload network request error.', 'danger');
            }
        }

        function showImagePreview(url) {
            document.getElementById('image-preview').src = url;
            document.getElementById('image-url-text').textContent = url;
            document.getElementById('image-preview-container').style.display = 'block';
            document.getElementById('upload-drop-zone').style.display = 'none';
        }

        function removeFeaturedImage() {
            currentFeaturedImageUrl = null;
            document.getElementById('image-file-input').value = '';
            document.getElementById('image-preview').src = '';
            document.getElementById('image-preview-container').style.display = 'none';
            document.getElementById('upload-drop-zone').style.display = 'block';
        }

        // Load Categories & Tags
        async function loadOptions() {
            // Categories
            const catRes = await fetch('/api/categories');
            const catData = await catRes.json();
            const catSelect = document.getElementById('post-category');
            catSelect.innerHTML = '<option value="">Select Category...</option>' + 
                (catData.categories || []).map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

            // Tags
            const tagRes = await fetch('/api/tags');
            const tagData = await tagRes.json();
            const tagContainer = document.getElementById('tags-checkbox-container');
            
            if ((tagData.tags || []).length === 0) {
                tagContainer.innerHTML = '<span style="color: var(--text-muted); font-size: 0.85rem;">No tags available. Add tags in dashboard.</span>';
            } else {
                tagContainer.innerHTML = (tagData.tags || []).map(t => `
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; font-weight: normal; cursor: pointer;">
                        <input type="checkbox" name="tag_ids" value="${t.id}">
                        ${escapeHtml(t.name)}
                    </label>
                `).join('');
            }

            if (editingPostId) {
                loadExistingPost(editingPostId);
            }
        }

        // Load Existing Post Data if Editing
        async function loadExistingPost(id) {
            document.getElementById('editor-page-title').textContent = 'Edit Blog Post';
            try {
                const res = await fetch(`/api/admin/blogs/${id}`, { headers: getAuthHeaders() });
                if (!res.ok) {
                    showAlert('Failed to load blog post data.', 'danger');
                    return;
                }
                const data = await res.json();
                const blog = data.blog;

                document.getElementById('post-title').value = blog.title || '';
                document.getElementById('post-slug').value = blog.slug || '';
                document.getElementById('post-excerpt').value = blog.excerpt || '';
                document.getElementById('post-content').innerHTML = blog.content || '';
                document.getElementById('seo-title').value = blog.meta_title || '';
                document.getElementById('seo-description').value = blog.meta_description || '';
                document.getElementById('reading-time').value = blog.reading_time || '5 min read';

                if (blog.category_id) {
                    document.getElementById('post-category').value = blog.category_id;
                }

                if (blog.featured_image) {
                    currentFeaturedImageUrl = blog.featured_image;
                    showImagePreview(blog.featured_image);
                }

                // Check tags
                if (blog.tag_ids && Array.isArray(blog.tag_ids)) {
                    const checkboxes = document.querySelectorAll('input[name="tag_ids"]');
                    checkboxes.forEach(cb => {
                        if (blog.tag_ids.includes(parseInt(cb.value, 10))) {
                            cb.checked = true;
                        }
                    });
                }
            } catch (err) {
                showAlert('Error loading blog post.', 'danger');
            }
        }

        // Save Blog Post (Draft or Published)
        async function savePost(targetStatus) {
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').innerHTML.trim();

            if (!title) {
                showAlert('Please enter a Blog Title.', 'danger');
                document.getElementById('post-title').focus();
                return;
            }

            if (!content || content === '<br>') {
                showAlert('Please write some content for the blog post.', 'danger');
                document.getElementById('post-content').focus();
                return;
            }

            const selectedTags = Array.from(document.querySelectorAll('input[name="tag_ids"]:checked')).map(cb => parseInt(cb.value, 10));

            const payload = {
                title,
                slug: document.getElementById('post-slug').value.trim(),
                excerpt: document.getElementById('post-excerpt').value.trim(),
                content,
                featured_image: currentFeaturedImageUrl,
                category_id: document.getElementById('post-category').value || null,
                status: targetStatus,
                reading_time: document.getElementById('reading-time').value.trim(),
                meta_title: document.getElementById('seo-title').value.trim(),
                meta_description: document.getElementById('seo-description').value.trim(),
                tag_ids: selectedTags
            };

            const draftBtn = document.getElementById('draft-btn');
            const publishBtn = document.getElementById('publish-btn');
            draftBtn.disabled = true;
            publishBtn.disabled = true;

            const method = editingPostId ? 'PUT' : 'POST';
            const endpoint = editingPostId ? `/api/admin/blogs/${editingPostId}` : '/api/admin/blogs';

            try {
                const res = await fetch(endpoint, {
                    method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    showAlert(`Blog post saved successfully as ${targetStatus.toUpperCase()}!`, 'success');
                    setTimeout(() => {
                        window.location.href = '/admin/index.html';
                    }, 1200);
                } else {
                    showAlert(data.error || 'Failed to save blog post.', 'danger');
                    draftBtn.disabled = false;
                    publishBtn.disabled = false;
                }
            } catch (err) {
                showAlert('Server connection error while saving.', 'danger');
                draftBtn.disabled = false;
                publishBtn.disabled = false;
            }
        }

        function showAlert(msg, type = 'success') {
            const box = document.getElementById('editor-alert');
            box.className = `alert alert-${type}`;
            box.textContent = msg;
            box.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/auth/logout', { method: 'POST' });
            localStorage.removeItem('admin_token');
            window.location.href = '/admin/login.html';
        });

        loadOptions();
    </script>
</body>
</html>
