<div class="u-embed-css w-embed">
    <style>
        cta-logo-grid {
            display: block;
            flex: 1;
            width: 100%;
        }

        @keyframes imgCycle {
            0% {
                clip-path: circle(0% at 50% 50%);
                pointer-events: none;
            }

            2.5% {
                clip-path: circle(75% at 50% 50%);
                pointer-events: auto;
            }

            47.5% {
                clip-path: circle(75% at 50% 50%);
                pointer-events: auto;
            }

            50% {
                clip-path: circle(0% at 50% 50%);
                pointer-events: none;
            }

            100% {
                clip-path: circle(0% at 50% 50%);
                pointer-events: none;
            }
        }

        .cta_grid_circle {
            position: relative;
            overflow: hidden;
        }

        .cta_grid_circle_img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 15%;
            box-sizing: border-box;
            clip-path: circle(0% at 50% 50%);
            animation: imgCycle 19.2s infinite;
            cursor: pointer;
        }

        .cta_grid_circle_img:nth-child(1) {
            animation-delay: var(--circle-delay, 0s);
        }

        .cta_grid_circle_img:nth-child(2) {
            animation-delay: calc(var(--circle-delay, 0s) + 9.6s);
        }

        /* Apply one of these as a combo class to each .cta_grid_circle */

        .cd-1 {
            --circle-delay: 1.6s;
        }

        .cd-2 {
            --circle-delay: 3.2s;
        }

        .cd-3 {
            --circle-delay: 4.8s;
        }

        .cd-4 {
            --circle-delay: 6.4s;
        }

        .cd-5 {
            --circle-delay: 8s;
        }

        /* All grid circles: rounded squares */
        .cta_grid_circle,
        .cta_grid_circle .cta_grid_circle_img {
            border-radius: 24px !important;
        }

        /* Default solid circle → dark olive */
        .cta_grid_circle:not(.is-blank):not(.is-pink):not(.is-orange):not(.is-yellow) {
            background-color: #2A2B25 !important;
        }

        /* Pink & yellow → bright yellow */
        .cta_grid_circle.is-pink,
        .cta_grid_circle.is-yellow {
            background-color: #FFE32A !important;
        }

        /* Orange → dark olive */
        .cta_grid_circle.is-orange {
            background-color: #2A2B25 !important;
        }

        @media screen and (max-width: 767px) {
            .cta_circles_wrap {
                display: flex !important;
                flex-direction: column;
                align-items: center;
                width: 100%;
            }

            .cta_circles_line {
                display: flex;
                justify-content: center;
                gap: 3vw;
                margin-bottom: 3vw;
                width: 100%;
            }

            .cta_grid_circle {
                width: 18vw;
                height: 18vw;
                max-width: 70px;
                max-height: 70px;
                flex-shrink: 0;
            }

            .cta_grid_circle,
            .cta_grid_circle .cta_grid_circle_img {
                border-radius: 12px !important;
            }
        }
    </style>
</div>
