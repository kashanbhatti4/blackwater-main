    <div class="simple-navbar">
        <style>
            body {
                padding-top: 100px;
            }

            .service_wrap,
            .u-position-sticky,
            .styleguide_nav_wrap,
            .home_about_content,
            .evolution_pin-wrap,
            .privacy_menu_sticky_wrap {
                top: 100px !important;
                min-height: calc(100vh - 100px) !important;
            }

            .simple-navbar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100px;
                z-index: 9999;
                background-color: #0E100F;
                border-bottom: 1px solid var(--swatch--border);
                pointer-events: none;
            }

            .simple-navbar__container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                height: 100%;
                box-sizing: border-box;
                pointer-events: none;
            }

            .simple-navbar__logo-box,
            .simple-navbar__burger-box {
                pointer-events: auto;
                height: 100%;
                background-color: #FFFCE1;
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
            }

            .simple-navbar__logo-box {
                padding: 0 2.5rem;
            }

            .simple-navbar__burger-box {
                padding: 0 3rem;
            }

            .simple-navbar__logo-link {
                display: block;
                width: 3.75rem;
                height: 3.75rem;
                color: #0E100F;
                transition: transform 0.3s ease;
            }



            .simple-navbar__logo-svg {
                width: 100%;
                height: 100%;
                display: block;
            }

            .simple-navbar__burger {
                background: none;
                border: none;
                padding: 0;
                width: 2.25rem;
                height: 1.25rem;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                cursor: pointer;
                color: #0E100F;
                position: relative;
                z-index: 10002;
                transition: color 0.3s ease;
            }

            .simple-navbar__burger-line {
                display: block;
                width: 100%;
                height: 2px;
                background-color: currentColor;
                transition: transform 0.4s cubic-bezier(0.625, 0.05, 0, 1), opacity 0.4s ease;
                transform-origin: center;
            }

            /* Burger transform to X when open */
            .simple-navbar.is-open .simple-navbar__burger {
                color: var(--_theme---text);
            }

            .simple-navbar.is-open .simple-navbar__burger-line:nth-child(1) {
                transform: translateY(0.55rem) rotate(45deg);
            }

            .simple-navbar.is-open .simple-navbar__burger-line:nth-child(2) {
                transform: translateY(-0.55rem) rotate(-45deg);
            }

            .simple-navbar__menu-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                background-color: var(--_theme---background);
                z-index: 10001;
                display: flex;
                justify-content: center;
                align-items: center;
                clip-path: circle(0% at calc(100% - 4.5rem) 50px);
                transition: clip-path 0.6s cubic-bezier(0.625, 0.05, 0, 1);
                pointer-events: none;
            }

            .simple-navbar.is-open .simple-navbar__menu-overlay {
                clip-path: circle(150% at calc(100% - 4.5rem) 50px);
                pointer-events: auto;
            }

            .simple-navbar__links {
                display: flex;
                flex-direction: column;
                gap: 2rem;
                list-style: none;
                padding: 0;
                margin: 0;
                text-align: center;
            }

            .simple-navbar__links-item {
                /* Removed overflow: hidden to prevent text clipping on hover */
            }

            .simple-navbar__link {
                display: inline-flex;
                align-items: baseline;
                gap: 1rem;
                text-decoration: none;
                font-family: 'Plain', sans-serif;
                font-size: 5rem;
                font-weight: 900;
                color: #7C7C70;
                transition: color 0.3s ease, transform 0.3s ease;
            }

            .simple-navbar__link-num {
                font-size: 1.75rem;
                font-weight: 500;
                font-family: 'Inter', sans-serif;
                opacity: 0.5;
            }

            /* Hover & Active states */
            .simple-navbar__link:hover {
                transform: translateX(12px);
            }

            .simple-navbar__link:hover,
            .simple-navbar__link.is-active {
                color: #FFFCE1;
            }

            body.no-scroll {
                overflow: hidden !important;
                height: 100vh;
            }

            @media (max-width: 48em) {
                body {
                    padding-top: 80px;
                }

                .service_wrap,
                .u-position-sticky,
                .styleguide_nav_wrap,
                .home_about_content,
                .evolution_pin-wrap,
                .privacy_menu_sticky_wrap {
                    top: 80px !important;
                    min-height: calc(100vh - 80px) !important;
                }

                .simple-navbar {
                    height: 80px;
                }

                .simple-navbar__logo-box {
                    padding: 0 1.5rem;
                }

                .simple-navbar__burger-box {
                    padding: 0 2rem;
                }

                .simple-navbar__logo-link {
                    width: 2.5rem;
                    height: 2.5rem;
                }

                .simple-navbar__burger {
                    width: 1.75rem;
                    height: 1rem;
                }

                .simple-navbar.is-open .simple-navbar__burger-line:nth-child(1) {
                    transform: translateY(0.45rem) rotate(45deg);
                }

                .simple-navbar.is-open .simple-navbar__burger-line:nth-child(2) {
                    transform: translateY(-0.45rem) rotate(-45deg);
                }

                .simple-navbar__menu-overlay {
                    clip-path: circle(0% at calc(100% - 2.9rem) 40px);
                }

                .simple-navbar.is-open .simple-navbar__menu-overlay {
                    clip-path: circle(150% at calc(100% - 2.9rem) 40px);
                }

                .simple-navbar__link {
                    font-size: 3rem;
                }

                .simple-navbar__link-num {
                    font-size: 1.25rem;
                }
            }
        </style>

                    switch (p) {
                        case "wp": return 20 + 20;
                        case "shopify": return rev >= 10000 ? 299 + 70 : rev >= 2000 ? 89 + 55 : 32 + 40;
                        case "sq": return rev > 0 ? 33 : 23;
                        case "wix": return rev > 0 ? 32 : 25;
                        case "wf": return rev > 0 ? 45 : 25 + 20;
                        case "custom": return 120 + 400;
                    }
                }
                function gatewayPenalty(p) { return { shopify: 0.02, sq: 0.02, wf: 0.02, wix: 0, wp: 0, custom: 0 }[p] || 0; }

                function buildCost(p, type, heavyCount) {
                    const base = {
                        template: { wp: [1800, 3200], shopify: [1800, 3500], wix: [1200, 2400], sq: [1200, 2600], wf: [2200, 4000], custom: [0, 0] },

                    }[type][p];
                    const bump = heavyCount * 900;
                    return [base[0] + bump, base[1] + bump];

                let showGateway = false;

                function raw() {
                    const s = { wp: 0, shopify: 0, wix: 0, sq: 0, wf: 0, custom: 0 };
                    const flags = new Set();
                    let heavy = 0;
                    QUESTIONS.forEach(q => {
                        const a = answers[q.id];
                        if (a === undefined) return;
                        const chosen = q.multi ? q.options.filter(o => a.includes(o.v)) : q.options.filter(o => o.v === a);
                        chosen.forEach(o => {
                            Object.entries(o.w || {}).forEach(([k, v]) => { s[k] += v; });
                            if (o.flag) { flags.add(o.flag); if (o.flag === "heavy") heavy++; }
                        });
                    });

                    const band = (QUESTIONS[1].options.find(o => o.v === answers.budget) || {}).band || 2;
                    if (band < 3) s.custom = 0;
                    if (flags.has("rush")) s.custom = 0;
                    if (flags.has("ownership")) { s.sq = Math.round(s.sq * 0.35); s.wix = Math.round(s.wix * 0.3); }
                    if (heavy >= 2) { s.wix = Math.round(s.wix * 0.4); s.sq = Math.round(s.sq * 0.4); }
                    if (flags.has("highRev")) { s.wix = Math.round(s.wix * 0.3); s.sq = Math.round(s.sq * 0.4); }
                    if (band === 1) { s.wf = Math.round(s.wf * 0.6); }

                    return { s, flags, heavy, band };
                }

                function buildType() {
                    const d = answers.design, band = (QUESTIONS[1].options.find(o => o.v === answers.budget) || {}).band || 2;
                    const rush = answers.timeline === "t1";
                    if (d === "bespoke" && band >= 3 && !rush) return "bespoke";
                    if (d === "bespoke") return "hybrid";
                    if (d === "hybrid") return band === 1 ? "template" : "hybrid";
                    return "template";
                }

                function result() {
                    const { s, flags, heavy, band } = raw();
                    const ranked = Object.entries(s).sort((a, b) => b[1] - a[1]);
                    let winner = ranked[0][0];
                    let downgraded = null;

                    if (winner === "custom" && (band < 4 || ranked[0][1] - (ranked[1] || [, 0])[1] < 4)) {
                        downgraded = "custom"; winner = ranked.find(([k]) => k !== "custom")[0];
                    }
                    const runner = ranked.find(([k]) => k !== winner)[0];
                    const rev = (QUESTIONS[4].options.find(o => o.v === answers.revenue) || { rev: 0 }).rev;
                    const type = buildType();
                    const build = buildCost(winner, type, heavy);
                    return { s, ranked, winner, runner, downgraded, flags, heavy, band, rev, type, build };
                }

                function curve(p, rev, type, heavy, months = 36, withGateway = false) {
                    const b = buildCost(p, type, heavy);
                    let total = (b[0] + b[1]) / 2;
                    const pts = [total];
                    for (let m = 1; m <= months; m++) {
                        let mo = monthlyCost(p, rev);
                        if (p === "wix" && m > 12) mo *= 1.35;
                        if (p === "sq" && m > 12) mo *= 1.15;
                        total += mo;
                        if (withGateway) total += rev * gatewayPenalty(p);
                        pts.push(total);
                    }
                    return pts;
                }

                    const series = keys.map(k => ({ k, pts: curve(k, r.rev, r.type, r.heavy, 36, showGateway) }));
                    const max = Math.max(...series.flatMap(s => s.pts)) * 1.08;
                    const W = 680, H = 250, PL = 54, PR = 8, PT = 10, PB = 26;
                    const x = m => PL + (m / 36) * (W - PL - PR);
                    const y = v => PT + (1 - v / max) * (H - PT - PB);

                    const grid = [0, .25, .5, .75, 1].map(f => {
                        const v = max * f;
                        return `<line class="grid" x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}"/>
            <text class="axis" x="0" y="${y(v) + 3.5}">€${Math.round(v).toLocaleString("en-IE")}</text>`;
                    }).join("");
                    const xlab = [0, 12, 24, 36].map(m => `<text class="axis" x="${x(m)}" y="${H - 6}" text-anchor="${m === 0 ? "start" : m === 36 ? "end" : "middle"}">${m === 0 ? "Build" : "Mth " + m}</text>`).join("");

                    const paths = series.map(s => {

                        return `<path class="line" d="${d}" stroke="${PLATFORMS[s.k].colour}" pathLength="1"
            style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease forwards"/>`;
                    }).join("");

                    const ends = series.map(s => {
                        const v = s.pts[36];
                        return `<circle cx="${x(36)}" cy="${y(v)}" r="3.5" fill="${PLATFORMS[s.k].colour}"/>`;
                    }).join("");

                    const legend = series.map(s => `<span><i style="background:${PLATFORMS[s.k].colour}"></i>${PLATFORMS[s.k].name} — €${Math.round(s.pts[36]).toLocaleString("en-IE")}</span>`).join("");

                    return `

        <style>@keyframes draw{to{stroke-dashoffset:0}}

        .chart-legend i { width:14px; height:3px; border-radius:2px; display:block; }
        </style>
        ${grid}${xlab}${paths}${ends}
      </svg>
    </div>
    <label class="toggle" style="display:flex; align-items:center; gap:10px; margin-top:16px; cursor:pointer;">

                        const buttonCenterX = buttonRect.left + buttonWidth / 2;
                        const mouseX = event.clientX;

                        const offsetXFromLeft = ((mouseX - buttonRect.left) / buttonWidth) * 100;

                        let offsetXFromCenter = Math.abs(((mouseX - buttonCenterX) / (buttonWidth / 2)) * 50);
                        const circle = button.querySelector('.btn__circle');

                    const L = ["PLATFORM FINDER — RESULT",
