<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Blog Post | Blackwater Digital</title>
    <meta id="meta-desc" name="description" content="Read full article on Blackwater Digital." />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/assets/css/webflow.css?v=64" rel="stylesheet" type="text/css" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
    <style>
        body {
            background-color: #0F1110;
            color: #FFFCE1;
            font-family: Inter, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .site-nav {
            padding: 24px 5%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-nav a {
            color: #FFFCE1;
            text-decoration: none;
            font-weight: 600;
        }

        .article-container {
            max-width: 860px;
            margin: 40px auto 80px;
            padding: 0 5%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #87BAB2;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 32px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #F17752;
        }

        .article-header {
            margin-bottom: 40px;
        }

        .article-category {
            display: inline-block;
            background: rgba(135, 186, 178, 0.15);
            color: #87BAB2;
            border: 1px solid rgba(135, 186, 178, 0.3);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .article-title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            color: #FFFCE1;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #9EA39E;
            font-size: 0.9rem;
            border-bottom: 1px solid #2A2E2A;
            padding-bottom: 24px;
        }

        .featured-image-wrapper {
            width: 100%;
            max-height: 480px;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid #2A2E2A;
            margin-bottom: 48px;
            background: #181A18;
        }

        .featured-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Article Rich Text Body */
        .article-content {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #C8CCC7;
        }

        .article-content h2, .article-content h3, .article-content h4 {
            color: #FFFCE1;
            margin-top: 48px;
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.3;
        }

        .article-content h2 { font-size: 2rem; border-bottom: 1px solid #2A2E2A; padding-bottom: 10px; }
        .article-content h3 { font-size: 1.5rem; }

        .article-content p {
            margin-bottom: 24px;
        }

        .article-content ul, .article-content ol {
            margin-bottom: 24px;
            padding-left: 28px;
        }

        .article-content li {
            margin-bottom: 10px;
        }

        .article-content blockquote {
            border-left: 4px solid #F17752;
            background: #181A18;
            padding: 20px 24px;
            border-radius: 0 8px 8px 0;
            margin: 32px 0;
            font-style: italic;
            color: #FFFCE1;
        }

        .article-content a {
            color: #87BAB2;
            text-decoration: underline;
        }

        .article-content img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 32px 0;
            border: 1px solid #2A2E2A;
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #2A2E2A;
        }

        .tag-pill {
            background: #181A18;
            border: 1px solid #2A2E2A;
            color: #9EA39E;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.82rem;
        }

        /* Related Section */
        .related-section {
            border-top: 1px solid #2A2E2A;
            padding-top: 60px;
            margin-top: 60px;
        }

        .related-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #FFFCE1;
            margin-bottom: 32px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        @media (max-width: 768px) {
            .article-title { font-size: 2.1rem; }
            .article-content { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-nav">
        <a href="/" style="display: flex; align-items: center; gap: 10px;">
            <img src="/logo.svg" alt="Blackwater Logo" style="height: 32px;">
            <span style="font-weight: 700; font-size: 1.1rem;">BLACKWATER</span>
        </a>
        <div style="display: flex; gap: 24px;">
            <a href="/">Home</a>
            <a href="/blog" style="color: #F17752;">Blog</a>
            <a href="/contact.html">Contact</a>
        </div>
    </header>

    <!-- Main Article -->
    <main class="article-container" id="article-main">
        <a href="/blog" class="back-link">← Back to Articles</a>
        <div style="text-align: center; padding: 100px 0; color: #9EA39E;">Loading article...</div>
    </main>

    <!-- Footer -->
    <footer style="border-top: 1px solid #2A2E2A; padding: 40px 5%; text-align: center; color: #9EA39E; font-size: 0.9rem;">
        <div style="max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div>© 2026 Blackwater Digital. All rights reserved.</div>
            <a href="/blog" style="color: #87BAB2; text-decoration: none;">View All Articles</a>
        </div>
    </footer>

    <script>
        async function loadArticle() {
            const container = document.getElementById('article-main');
            
            // Extract slug from URL path e.g. /blog/my-first-blog or query parameter
            let slug = window.location.pathname.replace('/blog/', '').trim();
            if (!slug || slug === 'blog-detail.html' || slug === 'blog-detail') {
                const params = new URLSearchParams(window.location.search);
                slug = params.get('slug');
            }

            if (!slug) {
                container.innerHTML = `
                    <a href="/blog" class="back-link">← Back to Articles</a>
                    <h1 style="color: #E74C3C; margin-top: 40px;">Blog Post Not Found</h1>
                    <p>No article slug specified in URL.</p>
                `;
                return;
            }

            try {
                const res = await fetch(`/api/blogs/slug/${slug}`);
                if (!res.ok) {
                    container.innerHTML = `
                        <a href="/blog" class="back-link">← Back to Articles</a>
                        <h1 style="color: #FFFCE1; margin-top: 40px;">404 - Article Not Found</h1>
                        <p style="color: #9EA39E; margin-top: 10px;">The blog article you are looking for does not exist or is saved as a draft.</p>
                        <a href="/blog" style="display: inline-block; margin-top: 20px; color: #F17752;">Explore Published Articles →</a>
                    `;
                    return;
                }

                const data = await res.json();
                const blog = data.blog;
                const related = data.related || [];

                // Dynamic SEO metadata update
                document.title = `${blog.meta_title || blog.title} | Blackwater Digital`;
                if (blog.meta_description) {
                    document.getElementById('meta-desc').setAttribute('content', blog.meta_description);
                }

                const dateStr = blog.published_at 
                    ? new Date(blog.published_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
                    : new Date(blog.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

                const featuredImgHtml = blog.featured_image ? `
                    <div class="featured-image-wrapper">
                        <img src="${blog.featured_image}" alt="${escapeHtml(blog.title)}" class="featured-image" onerror="this.style.display='none'">
                    </div>
                ` : '';

                const tagsHtml = (blog.tags || []).map(t => `<span class="tag-pill">#${escapeHtml(t.name)}</span>`).join('');

                const relatedHtml = related.length > 0 ? `
                    <section class="related-section">
                        <h2 class="related-title">More Articles</h2>
                        <div class="related-grid">
                            ${related.map(r => `
                                <a href="/blog/${r.slug}" style="text-decoration: none; color: inherit; background: #181A18; border: 1px solid #2A2E2A; border-radius: 12px; padding: 20px; transition: transform 0.2s;">
                                    <div style="font-size: 0.8rem; color: #87BAB2; font-weight: 600; margin-bottom: 8px;">${r.reading_time || '5 min read'}</div>
                                    <h3 style="font-size: 1.1rem; color: #FFFCE1; line-height: 1.4; margin-bottom: 10px;">${escapeHtml(r.title)}</h3>
                                    <p style="font-size: 0.88rem; color: #9EA39E; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${escapeHtml(r.excerpt || '')}</p>
                                </a>
                            `).join('')}
                        </div>
                    </section>
                ` : '';

                container.innerHTML = `
                    <a href="/blog" class="back-link">← Back to Articles</a>
                    
                    <header class="article-header">
                        <span class="article-category">${escapeHtml(blog.category_name || 'General')}</span>
                        <h1 class="article-title">${escapeHtml(blog.title)}</h1>
                        <div class="article-meta">
                            <span>Published on ${dateStr}</span>
                            <span>•</span>
                            <span>${blog.reading_time || '5 min read'}</span>
                        </div>
                    </header>

                    ${featuredImgHtml}

                    <div class="article-content">
                        ${blog.content}
                    </div>

                    ${tagsHtml ? `<div class="tags-list">${tagsHtml}</div>` : ''}

                    ${relatedHtml}
                `;
            } catch (err) {
                container.innerHTML = `<h2 style="color: #E74C3C;">Failed to load blog article.</h2>`;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        loadArticle();
    </script>
</body>
</html>
